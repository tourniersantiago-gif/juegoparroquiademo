la de tubos.",note:"NIVEL 2 · Acceso pendiente de documentar. Se incorporará cuando haya planos y fotografías de las escaleras.",pending:!0},puerta:{title:"Puerta principal",text:"Las hojas vidriadas de la puerta principal dan al pórtico, donde la imagen de María Auxiliadora recibe a quien llega. Afuera está la escalinata.",note:"Disposición del pórtico tomada de las fotos del ingreso."},escalera:{title:"Puerta lateral izquierda",text:"Una puerta junto al ingreso. En la planta del templo superior, en esta esquina hay una escalera con dos rótulos: «al coro, galería y torre» y «a la cripta».",note:"Fuente: planta del «Templo superior» aportada. En el juego la escalera todavía no se puede recorrer.",pending:!0},puerta_der:{title:"Puerta lateral derecha",text:"Una puerta junto al ingreso, del lado derecho. En la planta del templo superior, en esta esquina hay otra escalera con los mismos rótulos: «al coro, galería y torre» y «a la cripta».",note:"Fuente: planta del «Templo superior» aportada. En el juego la escalera todavía no se puede recorrer.",pending:!0},capillita:{title:"Capillita semicircular",text:"Cada tramo de las naves laterales se abre en una capillita semicircular con media cúpula y un vitral angosto. Por fuera son los volúmenes redondeados con techo de tejas que se ven desde el patio.",note:"Forma tomada de la planta del «Templo superior». Qué hay hoy en cada capillita (imágenes, confesionarios, altares) está pendiente de documentar con fotos.",pending:!0},crucero:{title:"Brazo del crucero",text:"Junto al presbiterio el muro lateral se retira y forma el brazo del crucero, iluminado por el gran ventanal. Del lado derecho, una puerta baja al patio del colegio.",note:"Forma tomada de la planta del «Templo superior» y de la foto nocturna del costado. Profundidad estimada."},sector_izq:{title:"Capilla lateral izquierda",text:"Al fondo de la nave lateral, una capilla con altar de mármol y una pintura de la Virgen con el Niño entre dos vitrales.",note:"La pintura uida a partir de las fotos; medidas estimadas."},torre:{title:"La torre",text:"La torre central tiene un campanario con aberturas en arco y una aguja roja coronada por una cruz, rodeada de pináculos. Su reloj, de la casa francesa Odobey, se inauguró y bendijo el 27 de septiembre de 1942: tiene cuatro cuadrantes de dos metros de diámetro, orientados a los cuatro puntos cardinales. Para llegar hasta él hay que subir 186 escalones. Fue restaurado y volvió a funcionar en la Navidad de 2024.",note:"Datos del reloj: sitio de la Casa Salesiana San José (Rosario), sección «Reloj de Torre». Campanas: pendientes de documentar."},carteles:{title:"Carteles del portal",text:"A los lados del portal cuelgan dos carteles. Uno tiene los horarios de misa: lunes a viernes, 8:00 y 19:00; sábados, 9:00 y 18:00; domingos, 9:00, 11:00 y 19:00. El otro dice «Jesús, en vos confío».",note:"Horarios aportados para el juego. Ante cualquier cambio, vale lo que informe la parroquia."},imagen_portico:{title:"Imagen de María Auxiliadora",text:"En el pórtico, sobre un pedestal claro, una imagen de la Virgen coronada con el Niño en brazos y el cetro recibe a quien entra.",note:"La figura del juego sigue la iconografía tradicional de María Auxiliadora, en versión simplificada: no reproduce la talla real."},verja:{title:"La verja",text:"Una verja de hierro con puntas doradas rodea el atrio y la escalinata.",note:"En el juego marca el límite de la exploración: la calle es solo decorado."},estatua_atrio:{title:"Estatua del atrio",text:"En la esquina del atrio, dentro de la verja, una estatua blanca muestra a un sacerdote con sotana que apoya la mano sobre el hombro de un niño.",note:"Por su iconografía podría ser San Juan Bosco, pero está pendiente de confirmar.",pending:!0},cripta_retablo:{title:"Retablo de la cripta",text:"Un retablo de mármol blanco: abajo, la Última Cena en relieve dorado entre columnillas de mármol rojo; encima, hornacinas con fondo rojo a los lados del sagrario dorado; más arriba, hornacinas altas en arco y una crestería ondulada; al centro, un templete gótico con IHS y una imagen blanca.",note:"Reconstrucción a partir de las fotos aportadas; los relieves están simplificados. Autor y fecha: pendientes de documentar."},cripta_imagen:{title:"Imagen del templete",text:"En el templete central del retablo hay una imagen blanca con los brazos abiertos, sobre un florero.",note:"Identificación de la imagen pendiente de confirmar con la parroquia.",pending:!0},cripta_cruz:{title:"Cruz «Salva tu alma»",text:"Frente al rellano de la escalera de bajada, sobre un arco, cuelga una gran cruz de madera oscura con la inscripción «Salva tu alma».",note:"Es el tipo de cruz que suele recordar una misión popular; su historia en esta parroquia está pendiente de documentar."},cripta_altar:{title:"Altar de la cripta",text:"La mesa del altar, sobre patas de madera, lleva un mantel blanco con el Chi-Rho y las letras Alfa y Omega bordadas en dorado, una cruz de bronce y una vela.",note:"Basado en las fotos aportadas."},cripta_relicarios:{title:"Hornacinas con relicarios",text:"En el retablo, seis hornacinas con fondo rojo y rejas guardan lo que parecen relicarios: medallones redondos dispuestos detrás de cada reja.",note:"Observación de las fotos. Qué reliquias contienen está pendiente de documentar con la parroquia.",pending:!0},cripta_placas:{title:"Placas conmemorativas",text:"Las bases ochavadas de los pilares están revestidas con placas de mármol negro con inscripciones.",note:"El juego no reproduce los nombres de las placas reales por respeto a las familias."},cripta_columbario:{title:"Columbario",text:"En los muros de la cripta hay paños de pequeñas placas negras ordenadas en grilla.",note:"Los nombres no se reproducen. Disposición aproximada según las fotos."},cripta_pulpito:{title:"Púlpito",text:"Un púlpito de madera oscura tallada, de caja ochavada con paneles en relieve, al que se sube por una escalera.",note:"Modelo simplificado basado en las fotos."},crip  colegio",text:"El patio de baldosas está rodeado por galerías de columnas finas; arriba corre un balcón con baranda de hierro. Una escalera con balaustrada sube a la planta alta.",note:"Disposición y medidas aproximadas, a partir de las fotos aportadas y de una vista aérea. La planta alta no se puede recorrer en este prototipo."},cripta_escalera:{title:"Escalera de la cripta",text:"La escalera baja desde la puerta de bronce hasta un rellano y ahí dobla: un tramo corto, con balaustradas de piedra a los dos lados, desemboca en la cripta. En la esquina del rellano, un pilar cuadrado con capitel sostiene los arcos.",note:"Basado en una foto histórica publicada en «El Constructor Rosarino» («Cripta del futuro templo María Auxiliadora»), combinada con las fotos actuales (pasamanos y cruz «Salva tu alma» frente al rellano). Medidas estimadas."}};for(let e of Qo)Ko["vitral_"+e.n]={title:`Vitral N.º ${e.n}`,text:`${e.label}.`,note:"Escena y colores reales pendientes: cuando llegue la foto de este vitral, se reemplaza el dibujo provisional por el real.",pending:!0};var Ut=0.11,Vp={radius:Ut,height:Ut*2,stepUp:0.03},my=9.8;function Bp(){let e=Ue(),t=(1+Math.sqrt(5))/2,a=[];for(let l of[-1,1])for(let n of[-t,t])a.push([0,l,n],[l,n,0],[n,0,l]);for(let l of a){let n=Math.hypot(l[0],l[1],l[2]),o=[l[0]/n,l[1]/n,l[2]/n],i=-Math.asin(o[1]),r=Math.atan2(o[0],o[2]),u=Ut*1.004;Ln(e,tt(F(Ut*0.36,5),re(W(),[o[0]*u,o[1]*u,o[2]*u],[i,r,0])))}return{ballWhite:V(Ut,18,12),ballBlack:e}}class K0{cw;home;goals;area;x=0;y=0;z=0;vx=0;vy=0;vz=0;orient=W();goalCooldown=0;resetTimer=0;onGoal=null;lastTouch=null;get resetting(){return this.resetTimer>0}constructor(e,t,a,l){this.cw=e;this.home=t;this.goals=a;this.area=l;this.reset()}reset(){[this.x,this.y,this.z]=this.home,this.vx=this.vy=this.vz=0}topAt(e,t){return this.cw.groundAt(e,t,1e6,0,Ut*2)}get speed(){return Math.hypot(this.vx,this.vy,this.vz)}kickable(e,t,a,l){let n=this.x-e,o=this.z-a,i=Math.hypot(n,o);if(i>1.7||Math.abs(this.y-t)>0.8)retur
